name: Validate Vaughan Code University

on:
  pull_request:
  push:
    branches:
      - main
      - 'feature/**'

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: TypeScript check
        run: bun run lint

      - name: Production build
        run: bun run build

      - name: Unit tests
        run: bun run test
